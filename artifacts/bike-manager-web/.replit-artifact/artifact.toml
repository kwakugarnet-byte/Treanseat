kind = "web"
previewPath = "/bike-manager/"
title = "Bike Manager"
description = "A bike fleet management dashboard for tracking bikes, riders, sales, maintenance, profit, payments, and operational reports."
version = "1.0.0"
id = "artifacts/bike-manager-web"
router = "path"

[[services]]
name = "web"
paths = [ "/bike-manager/" ]
localPort = 19966

[services.development]
run = "pnpm --filter @workspace/bike-manager-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bike-manager-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/bike-manager-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19966"
BASE_PATH = "/bike-manager/"
